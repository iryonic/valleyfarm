<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <!-- Warm cream circular background element -->
  <circle cx="100" cy="80" r="72" fill="#FFF8EC" stroke="#E6E7DD" stroke-width="2"/>
  
  <!-- Sunrise -->
  <circle cx="100" cy="70" r="28" fill="#FACC15"/>
  <line x1="100" y1="34" x2="100" y2="26" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="44" x2="66" y2="38" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="44" x2="134" y2="38" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Distant Hill -->
  <path d="M35 105 C60 85, 90 85, 115 95 C135 78, 160 88, 168 105" fill="#22C55E" stroke="#16A34A" stroke-width="2"/>

  <!-- Farmhouse Silhouette -->
  <g transform="translate(112, 68)">
    <polygon points="10,2 24,14 24,28 0,28 0,14" fill="#FFF8EC" stroke="#16A34A" stroke-width="2"/>
    <rect x="18" y="2" width="4" height="8" fill="#D97950" stroke="#16A34A" stroke-width="1.5"/>
    <rect x="7" y="18" width="6" height="10" fill="#16A34A"/>
    <!-- Silo / barn next door -->
    <path d="M26 12 C26 8, 36 8, 36 12 L36 28 L26 28 Z" fill="#22C55E" stroke="#16A34A" stroke-width="1.5"/>
  </g>

  <!-- Rolling Pasture Foreground -->
  <path d="M30 115 C60 102, 100 120, 140 106 C155 102, 165 108, 170 115 L170 145 C150 152, 50 152, 30 145 Z" fill="#16A34A" stroke="#064E3B" stroke-width="2.5"/>
  
  <!-- Post & Rail Wooden Fence -->
  <g stroke="#FACC15" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="120" x2="50" y2="135"/>
    <line x1="75" y1="118" x2="75" y2="135"/>
    <line x1="100" y1="122" x2="100" y2="138"/>
    <line x1="45" y1="124" x2="105" y2="124"/>
    <line x1="45" y1="130" x2="105" y2="130"/>
  </g>
</svg>
