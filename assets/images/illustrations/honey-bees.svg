<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <!-- Warm cream circular background element -->
  <circle cx="100" cy="80" r="72" fill="#FFF8EC" stroke="#E6E7DD" stroke-width="2"/>
  
  <!-- Honeycomb pattern in background -->
  <g stroke="#FACC15" stroke-width="2" fill="#FFF8EC">
    <polygon points="50,45 62,38 74,45 74,59 62,66 50,59"/>
    <polygon points="74,45 86,38 98,45 98,59 86,66 74,59" fill="#FACC15" fill-opacity="0.4"/>
    <polygon points="62,66 74,59 86,66 86,80 74,87 62,80"/>
  </g>

  <!-- Honey Jar -->
  <g transform="translate(68, 52)">
    <!-- Jar neck & cork lid -->
    <rect x="18" y="10" width="28" height="8" rx="2" fill="#D97950" stroke="#064E3B" stroke-width="2"/>
    <path d="M12 18 L52 18 L50 24 L14 24 Z" fill="#FFF8EC" stroke="#064E3B" stroke-width="2"/>
    <!-- String / tie -->
    <path d="M10 22 C14 23, 50 23, 54 22" stroke="#16A34A" stroke-width="2"/>
    <circle cx="32" cy="24" r="3" fill="#D97950"/>
    
    <!-- Glass Jar Body -->
    <path d="M12 24 C8 32, 6 68, 12 76 C16 82, 48 82, 52 76 C58 68, 56 32, 52 24 Z" fill="#FFF8EC" stroke="#16A34A" stroke-width="3"/>
    <!-- Golden Honey Inside -->
    <path d="M11 36 C18 34, 46 38, 53 36 C55 45, 54 66, 49 74 C46 78, 18 78, 15 74 C10 66, 9 45, 11 36 Z" fill="#FACC15"/>
    <path d="M14 44 C22 42, 42 45, 50 44 C52 50, 50 68, 46 72 C42 75, 22 75, 18 72 C14 68, 12 50, 14 44 Z" fill="#D97950" fill-opacity="0.2"/>
    
    <!-- Jar Label -->
    <rect x="20" y="44" width="24" height="18" rx="3" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <line x1="24" y1="49" x2="40" y2="49" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="54" x2="38" y2="54" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wooden Honey Dipper -->
  <g transform="translate(118, 55) rotate(25)">
    <!-- Stick -->
    <rect x="18" y="0" width="4" height="65" rx="2" fill="#D97950" stroke="#16A34A" stroke-width="1.5"/>
    <!-- Head rungs -->
    <rect x="12" y="48" width="16" height="4" rx="2" fill="#FACC15" stroke="#16A34A" stroke-width="1.5"/>
    <rect x="10" y="54" width="20" height="4" rx="2" fill="#FACC15" stroke="#16A34A" stroke-width="1.5"/>
    <rect x="12" y="60" width="16" height="4" rx="2" fill="#FACC15" stroke="#16A34A" stroke-width="1.5"/>
    <!-- Drip -->
    <path d="M20 66 C18 72, 22 74, 20 78 C18 76, 18 70, 20 66 Z" fill="#FACC15" stroke="#16A34A" stroke-width="1"/>
  </g>

  <!-- Friendly Honeybee -->
  <g transform="translate(42, 42) rotate(-15)">
    <!-- Wings -->
    <ellipse cx="14" cy="6" rx="6" ry="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" opacity="0.9" transform="rotate(-30 14 6)"/>
    <ellipse cx="20" cy="6" rx="6" ry="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" opacity="0.9" transform="rotate(30 20 6)"/>
    <!-- Body -->
    <ellipse cx="16" cy="18" rx="8" ry="12" fill="#FACC15" stroke="#16A34A" stroke-width="2"/>
    <!-- Stripes -->
    <line x1="9" y1="16" x2="23" y2="16" stroke="#16A34A" stroke-width="2"/>
    <line x1="10" y1="21" x2="22" y2="21" stroke="#16A34A" stroke-width="2"/>
    <!-- Flight path dashed -->
    <path d="M-10 30 C-2 32, -4 20, 6 22" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>
