  <circle cx="145" cy="45" r="22" fill="#FACC15" opacity="0.9"/>
  <!-- Basket handle -->
  <path d="M60 90 C60 40, 140 40, 140 90" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
  <path d="M65 90 C65 48, 135 48, 135 90" stroke="#D97950" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <!-- Straw bed -->
  <path d="M48 95 Q100 85 152 95 Q135 110 65 110 Z" fill="#FACC15"/>
  <path d="M42 96 L58 90 M60 92 L75 86 M85 90 L102 85 M115 88 L130 84 M138 92 L155 88" stroke="#D97950" stroke-width="2" stroke-linecap="round"/>
  <!-- Eggs in basket -->
  <ellipse cx="78" cy="85" rx="14" ry="18" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" transform="rotate(-15 78 85)"/>
  <ellipse cx="100" cy="82" rx="14" ry="18" fill="#FFF8EC" stroke="#16A34A" stroke-width="2.5"/>
  <ellipse cx="122" cy="85" rx="14" ry="18" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" transform="rotate(15 122 85)"/>
  <ellipse cx="90" cy="92" rx="12" ry="16" fill="#FACC15" stroke="#16A34A" stroke-width="2.5" transform="rotate(25 90 92)"/>
  <ellipse cx="110" cy="92" rx="12" ry="16" fill="#FFF8EC" stroke="#16A34A" stroke-width="2.5" transform="rotate(-20 110 92)"/>
  <!-- Woven basket base -->
  <path d="M48 95 L58 135 C60 142, 140 142, 142 135 L152 95 Z" fill="#16A34A" stroke="#064E3B" stroke-width="3"/>
  <!-- Weave lines -->
  <path d="M54 108 Q100 115 146 108" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M56 122 Q100 128 144 122" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fresh herb sprig -->
  <path d="M140 115 C150 110, 160 115, 162 108" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="152" cy="110" r="3.5" fill="#22C55E"/>
  <circle cx="162" cy="108" r="3" fill="#22C55E"/>
</svg>
